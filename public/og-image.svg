<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0754d8"/>
      <stop offset="100%" style="stop-color:#021a52"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.06)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#shine)"/>
  <!-- grid pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- title -->
  <text x="600" y="270" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-size="72" font-style="italic" fill="rgba(255,255,255,0.95)">supernbking</text>
  <!-- subtitle -->
  <text x="600" y="340" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.55)">Creative Developer &amp; CS Student</text>
  <!-- decorative bar -->
  <rect x="520" y="360" width="160" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
</svg>
