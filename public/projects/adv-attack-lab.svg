<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <!-- noise pattern -->
  <rect x="500" y="150" width="200" height="100" rx="8" fill="rgba(233,69,96,0.15)" stroke="rgba(233,69,96,0.3)" stroke-width="1"/>
  <text x="530" y="195" font-family="monospace" font-size="11" fill="rgba(233,69,96,0.6)">+ε · sign(∇xL)</text>
  <text x="530" y="215" font-family="monospace" font-size="11" fill="rgba(233,69,96,0.4)">FGSM Attack</text>
  <text x="530" y="235" font-family="monospace" font-size="11" fill="rgba(83,52,131,0.6)">PGD · MI-FGSM</text>
  <!-- title -->
  <text x="400" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="rgba(255,255,255,0.85)" filter="url(#glow)">Adversarial Attack Lab</text>
  <text x="400" y="155" text-anchor="middle" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.45)">ML Security · 5 Attacks · 2 Defenses · Benchmark Suite</text>
  <!-- decorative dots -->
  <circle cx="120" cy="250" r="3" fill="rgba(233,69,96,0.4)"/>
  <circle cx="140" cy="240" r="2" fill="rgba(83,52,131,0.3)"/>
  <circle cx="100" cy="270" r="2" fill="rgba(233,69,96,0.3)"/>
  <circle cx="160" cy="260" r="3" fill="rgba(83,52,131,0.4)"/>
</svg>
