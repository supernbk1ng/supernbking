<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="path" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- maze grid -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none">
    <rect x="80" y="80" width="240" height="240"/>
    <line x1="160" y1="80" x2="160" y2="160"/>
    <line x1="80" y1="120" x2="160" y2="120"/>
    <line x1="240" y1="80" x2="240" y2="200"/>
    <line x1="160" y1="240" x2="240" y2="240"/>
    <line x1="80" y1="200" x2="160" y2="200"/>
    <line x1="160" y1="160" x2="320" y2="160"/>
    <line x1="80" y1="280" x2="240" y2="280"/>
  </g>
  <!-- path trace -->
  <polyline points="120,300 120,260 200,260 200,180 280,180 280,140 300,140" fill="none" stroke="url(#path)" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.7"/>
  <!-- start marker -->
  <circle cx="120" cy="300" r="6" fill="#58a6ff" filter="url(#glow)"/>
  <text x="120" y="320" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(88,166,255,0.6)">Start</text>
  <!-- goal marker -->
  <circle cx="300" cy="140" r="6" fill="#3fb950" filter="url(#glow)"/>
  <text x="300" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(63,185,80,0.6)">Goal</text>
  <!-- title -->
  <text x="560" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="rgba(255,255,255,0.85)" filter="url(#glow)">DQN Maze Navigator</text>
  <text x="560" y="205" text-anchor="middle" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.45)">Deep RL · Q-Learning · DQN · Prim's Maze Generation</text>
  <!-- legend -->
  <rect x="530" y="240" width="60" height="4" rx="2" fill="rgba(88,166,255,0.4)"/>
  <text x="600" y="246" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">Q-Learning</text>
  <rect x="530" y="260" width="60" height="4" rx="2" fill="rgba(63,185,80,0.4)"/>
  <text x="600" y="266" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">DQN (PyTorch)</text>
  <rect x="530" y="280" width="60" height="4" rx="2" fill="rgba(188,140,255,0.4)"/>
  <text x="600" y="286" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">DQN (Keras)</text>
</svg>
